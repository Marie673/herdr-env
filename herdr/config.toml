onboarding = false

[theme]
# テーマ（配色）は好みなので、このリポジトリでは共有しない。
# name を明示すると Navigator もそれを継承する。未指定だと Navigator 側が
# One Light へフォールバックするので、好きなテーマを name に入れておくとよい。
# name = "tokyo-night"

auto_switch = false
[ui]
agent_panel_sort = "spaces"

# 日本語（全角）の会話タイトルをサイドバーに出すため広げる
sidebar_width = 40
sidebar_max_width = 44

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
[ui.sidebar.agents]
row_gap = 0
# claude 以外のエージェント用フォールバック
rows = [
  ["state_icon", { token = "$title", fg = "#f2f2f2", bold = true, dim = false }],
  [
    { token = "$provider", fg = "#f2f2f2", dim = false },
    { token = "$limit", fg = "#f2f2f2", dim = false },
  ],
  [{ token = "$context", fg = "#f2f2f2", dim = false }],
]

[ui.sidebar.agents.rows_by_agent]
# 1行目に会話タイトル（識別の主役）、2行目に場所と状態を控えめに
# dim = false を明示して、非フォーカス行が既定で薄くなるのを打ち消す
claude = [
  [
    { token = "state_icon", dim = false },
    { token = "terminal_title_stripped", fg = "#ffffff", bold = true, dim = false },
  ],
  # $act は自作フック herdr-activity.sh が報告する「今やっている操作」
  [{ token = "$act", fg = "#f2f2f2", dim = false }],
  # どのアカウントで動いているかと、そのアカウントの上限の残り（claude-account が statusLine から出す）。
  # usagebar の $limit は使わない。会話の記録をアカウント間で共有しているので、usagebar の
  # ペイン→アカウントの判定が当たらない
  [{ token = "$acct", fg = "#f2f2f2", bold = true, dim = false }],
  [{ token = "$context", fg = "#f2f2f2", dim = false }],
  [
    { token = "workspace", fg = "#f2f2f2", dim = false },
    { token = "tab", fg = "#f2f2f2", dim = false },
    { token = "state_text", dim = false },
  ],
]

# codex は terminal_title が "Okazaki" 固定で会話タイトルにならないため、
# 識別の主役は tab に置く（claude の terminal_title_stripped に相当）
codex = [
  [
    { token = "state_icon", dim = false },
    { token = "tab", fg = "#ffffff", bold = true, dim = false },
  ],
  [
    { token = "workspace", fg = "#f2f2f2", dim = false },
    { token = "agent", fg = "#f2f2f2", dim = false },
    { token = "state_text", dim = false },
  ],
  [
    { token = "$provider", fg = "#f2f2f2", dim = false },
    { token = "$limit", fg = "#f2f2f2", dim = false },
  ],
  [{ token = "$context", fg = "#f2f2f2", dim = false }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "workspace", fg = "#ffffff", bold = true, dim = false },
    # ワークツリーの初回セットアップ（worktree-setup プラグイン）。実行中は黄、失敗は赤
    { token = "$setup", fg = "#e0af68", dim = false, rules = [{ contains = "✗", fg = "#f7768e", bold = true }] },
  ],
  [
    { token = "branch", fg = "#f2f2f2", dim = false },
    { token = "git_status", fg = "#f2f2f2", dim = false },
  ],
  # PR の状態（pr-status プラグイン）。PR が無い space ではこの行ごと消える
  [
    { token = "$pr", fg = "#f2f2f2", dim = false, rules = [
      { contains = "merged", fg = "#bb9af7" },
      { contains = "closed", fg = "#737aa2" },
      { contains = "競合", fg = "#f7768e", bold = true },
      { contains = "draft", fg = "#737aa2" },
    ] },
    { token = "$ci", fg = "#f2f2f2", dim = false, rules = [
      { contains = "✗", fg = "#f7768e", bold = true },
      { contains = "…", fg = "#e0af68" },
      { contains = "✓", fg = "#9ece6a" },
    ] },
    { token = "$rv", fg = "#7aa2f7", dim = false, rules = [
      { contains = "要修正", fg = "#f7768e", bold = true },
      { contains = "未解決", fg = "#ff9e64" },
      { contains = "…", fg = "#e0af68" },
      { contains = "承認", fg = "#9ece6a" },
      { contains = "✓", fg = "#9ece6a" },
    ] },
  ],
]

# --- プラグインのキーバインド（2026-08-20 追加）---
[keys]
prefix = "ctrl+a"
new_workspace = ""
# サイドバーのagents行を番号で直接フォーカスする（行 ↔ ペインの対応を確認する用）
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = "zsh ~/.config/herdr/bin/new-workspace-picker.sh"
description = "choose directory and create workspace"
width = "85%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "open terminal-browser"

[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[experimental]
kitty_graphics = true

# バックグラウンド workspace のエージェント状態変化を OS 通知で出す（2026-08-22 追加）
[ui.toast]
delivery = "system"

# agentsペインの表示範囲を「現在のspaceだけ / 全部」で切り替える（2026-09-04 追加）
[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "agent-view-space.toggle"
description = "toggle agents pane scope (current space / all)"

# 今いるペインの pane_id をクリップボードへ（他ペインからそのペインを指す用、2026-09-07 追加）
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "pane-id-copy.copy"
description = "copy this pane's id to the clipboard"

# issue 一覧（issue-board プラグイン）。対象リポジトリの main の space で右に出す。この space での出し入れ
[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "issue-board.toggle"
description = "toggle the issue board in this space"

# Claude のアカウント（claude-accounts プラグイン）。
# 選んだアカウントで新しいタブに起動する／このペインの会話を別アカウントで開き直す
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "claude-accounts.pick"
description = "Claude account: start / switch"
